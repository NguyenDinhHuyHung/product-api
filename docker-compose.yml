services:
  mongodb:
    image: mongo:8
    container_name: nammongodb
    ports:
      - "27017:27017"
    volumes:
      - nammongodb_data:/data/db
    networks:
      - product-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  product-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-api-container
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/productdb
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - product-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  nammongodb_data:
    name: nammongodb_data

networks:
  product-network:
    name: product-network
    driver: bridge